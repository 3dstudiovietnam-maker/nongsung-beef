    <radialGradient id="g2" cx="92%" cy="-5%" r="70%"><stop offset="0" stop-color="#D2A64B" stop-opacity=".38"/><stop offset="1" stop-color="#D2A64B" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="900" fill="#0B0A0D"/>
  <rect width="1200" height="900" fill="url(#g1)"/>
  <rect width="1200" height="900" fill="url(#g2)"/>
  <g transform="translate(600 330)">
    <circle r="150" fill="none" stroke="#D2A64B" stroke-width="4"/>
    <circle r="98" fill="#B4152B"/>
    <g transform="scale(4.6) translate(-32 -32)">
